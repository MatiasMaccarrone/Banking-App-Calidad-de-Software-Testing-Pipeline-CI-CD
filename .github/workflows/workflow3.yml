name: CD on Main Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/**
      - README.md

jobs:
  publish-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Get version from pom.xml
        id: version
        run: echo "app_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Build JAR
        run: mvn package -DskipTests

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: mvn spring-boot:build-image -DskipTests -Dspring-boot.build-image.imageName=${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ steps.version.outputs.app_version }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ steps.version.outputs.app_version }}

  deploy-azure:
    name: Deploy to Azure
    needs: publish-docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: banking-app-production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ needs.publish-docker.outputs.app_version }}

  smoke-test:
    name: Run Smoke Test
    needs: [publish-docker, deploy-azure]
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Smoke Test
        run: mvn test -Dtest=SmokeTest -Dapp.version=${{ needs.publish-docker.outputs.app_version }} -Dazure.url=https://banking-app-production-h4awerbsgwd5aqdd.polandcentral-01.azurewebsites.net