name: Test on commits Workflow

on:  
  workflow_dispatch:
  push: 
    branches-ignore:
      - main
    paths-ignore:
      - .github/workflows/**
      - README.md

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout 
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
            java-version: '21'
            distribution: 'temurin'
            cache: 'maven'

      - name: Execute unitary tests 
        run: mvn test -Dtest="!TransferE2ETest"