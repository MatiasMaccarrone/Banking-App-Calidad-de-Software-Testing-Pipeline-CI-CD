name: Pre-Mergue Checks Workflow

on:
  workflow_dispatch:
  pull_request:
    branches: 
      - main
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute unit tests
        run: mvn test -Dtest="!TransferE2ETest,!TransferOwnAccount,!SmokeTest"
  
  system-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute system test
        run: mvn test -Dtest="TransferE2ETest,TransferOwnAccount"
    